run:
  timeout: 5m
  build-tags: []

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - unconvert
    - revive
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/stephencshelton/discord-dnd-bot
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    # Test files may skip some checks.
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
  max-issues-per-linter: 0
  max-same-issues: 0
