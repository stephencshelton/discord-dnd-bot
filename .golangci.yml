version: "2"

run:
  timeout: 5m
  build-tags: []

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck # gosimple is merged into staticcheck in v2
    - unused
    - bodyclose
    - misspell
    - unconvert
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Test files may skip some checks.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/stephencshelton/discord-dnd-bot

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
