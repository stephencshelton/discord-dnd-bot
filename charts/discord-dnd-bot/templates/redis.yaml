{{- if .Values.redis.enabled }}
{{- /*
Optional bundled Redis for evaluation / self-hosting, using the official redis
image (no third-party subchart). The Service is named <fullname>-redis-master to
match the default config.redis.addr. For production, prefer managed Redis and
set redis.enabled=false. Auth is off by default; when enabled, the password is
passed via --requirepass and must match secrets.redisPassword.
*/}}
{{- $name := printf "%s-redis-master" (include "discord-dnd-bot.fullname" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "discord-dnd-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "discord-dnd-bot.componentSelectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "discord-dnd-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "discord-dnd-bot.componentSelectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "discord-dnd-bot.componentSelectorLabels" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      priorityClassName: {{ .Values.redis.priorityClassName | default "system-cluster-critical" }}
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          {{- if .Values.redis.auth.enabled }}
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--save", "60", "1"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "discord-dnd-bot.secretName" . }}
                  key: REDIS_PASSWORD
          {{- else }}
          args: ["--save", "60", "1"]
          {{- end }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.redis.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if and .Values.redis.podDisruptionBudget .Values.redis.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "discord-dnd-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  minAvailable: {{ .Values.redis.podDisruptionBudget.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "discord-dnd-bot.componentSelectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
{{- end }}
{{- if .Values.redis.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "discord-dnd-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.redis.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
{{- end }}
{{- end }}
