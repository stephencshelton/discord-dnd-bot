{{- if and .Values.worker.enabled .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "discord-dnd-bot.fullname" . }}-worker
  labels:
    {{- include "discord-dnd-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "discord-dnd-bot.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
{{- end }}
{{- if and .Values.stt.enabled .Values.stt.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "discord-dnd-bot.fullname" . }}-stt
  labels:
    {{- include "discord-dnd-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: stt
spec:
  minAvailable: {{ .Values.stt.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "discord-dnd-bot.componentSelectorLabels" (dict "root" . "component" "stt") | nindent 6 }}
{{- end }}
