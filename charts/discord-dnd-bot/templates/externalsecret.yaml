{{- if .Values.secrets.externalSecret.enabled }}
{{- if .Values.secrets.existingSecret }}
{{- fail "secrets.existingSecret cannot be used with secrets.externalSecret.enabled" }}
{{- end }}
{{- if not .Values.secrets.externalSecret.secretStoreRef.name }}
{{- fail "secrets.externalSecret.secretStoreRef.name is required when externalSecret is enabled" }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ default (printf "%s-external-secrets" (include "discord-dnd-bot.fullname" .)) .Values.secrets.externalSecret.name }}
  labels:
    {{- include "discord-dnd-bot.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreRef.name | quote }}
    kind: {{ .Values.secrets.externalSecret.secretStoreRef.kind | quote }}
  target:
    name: {{ include "discord-dnd-bot.secretName" . }}
    creationPolicy: {{ .Values.secrets.externalSecret.target.creationPolicy | quote }}
  data:
    {{- toYaml .Values.secrets.externalSecret.data | nindent 4 }}
{{- end }}