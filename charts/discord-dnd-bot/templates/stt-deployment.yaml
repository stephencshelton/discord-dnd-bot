{{- if .Values.stt.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "discord-dnd-bot.fullname" . }}-stt
  labels:
    {{- include "discord-dnd-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: stt
spec:
  {{- if and (not .Values.stt.autoscaling.enabled) (not .Values.stt.keda.enabled) }}
  replicas: {{ .Values.stt.replicaCount }}
  {{- end }}

  # Model weights live on a single RWO PVC; avoid two pods mounting it at once.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      {{- include "discord-dnd-bot.componentSelectorLabels" (dict "root" . "component" "stt") | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "discord-dnd-bot.componentSelectorLabels" (dict "root" . "component" "stt") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: {{ include "discord-dnd-bot.serviceAccountName" . }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: stt
          image: "{{ .Values.stt.image.repository }}:{{ .Values.stt.image.tag }}"
          imagePullPolicy: {{ .Values.stt.image.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          env:
            # Default Whisper model.
            - name: WHISPER__MODEL
              value: {{ .Values.stt.model | quote }}

            # Download model weights during startup.
            - name: PRELOAD_MODELS
              value: '["{{ .Values.stt.model }}"]'

            - name: HOME
              value: /home/ubuntu

            - name: PATH
              value: /home/ubuntu/speaches/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

            - name: HF_HOME
              value: /home/ubuntu/.cache/huggingface

            - name: HF_HUB_CACHE
              value: /home/ubuntu/.cache/huggingface/hub

            {{- if .Values.stt.gpu.enabled }}
            # Run faster-whisper/CTranslate2 on the NVIDIA GPU.
            - name: WHISPER__INFERENCE_DEVICE
              value: "cuda"

            # FP16 gives excellent Large-v3 performance on NVIDIA GPUs
            # while comfortably fitting T4/A10G/L4 VRAM.
            - name: WHISPER__COMPUTE_TYPE
              value: {{ .Values.stt.gpu.computeType | quote }}

            # GPU index exposed by the NVIDIA device plugin.
            - name: WHISPER__DEVICE_INDEX
              value: "0"

            # One inference worker per GPU. Multiple workers would compete
            # for the same GPU and aren't useful for our sequential
            # three-minute transcription chunks.
            - name: WHISPER__NUM_WORKERS
              value: {{ .Values.stt.gpu.numWorkers | quote }}

            # Keep Large-v3 resident in VRAM between chunks.
            # The entire pod will disappear when KEDA scales STT to zero,
            # so unloading it while the pod is alive just adds latency.
            - name: STT_MODEL_TTL
              value: {{ .Values.stt.gpu.modelTtl | quote }}
            {{- end }}

            {{- with .Values.stt.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          ports:
            - name: http
              containerPort: {{ .Values.stt.port }}
              protocol: TCP

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.stt.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.stt.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.stt.startupProbe.failureThreshold }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15

          resources:
            {{- toYaml .Values.stt.resources | nindent 12 }}

          volumeMounts:
            - name: cache
              mountPath: /home/ubuntu/.cache

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: cache
          {{- if .Values.stt.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "discord-dnd-bot.fullname" . }}-stt
          {{- else }}
          emptyDir: {}
          {{- end }}

        - name: tmp
          emptyDir: {}

      {{- with .Values.stt.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.stt.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.stt.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.stt.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "discord-dnd-bot.fullname" . }}-stt
  labels:
    {{- include "discord-dnd-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: stt

spec:
  accessModes:
    {{- toYaml .Values.stt.persistence.accessModes | nindent 4 }}

  {{- with .Values.stt.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}

  resources:
    requests:
      storage: {{ .Values.stt.persistence.size }}
{{- end }}
{{- end }}