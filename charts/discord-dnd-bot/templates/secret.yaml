{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "discord-dnd-bot.secretName" . }}
  labels:
    {{- include "discord-dnd-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DISCORD_TOKEN: {{ .Values.secrets.discordToken | quote }}
  {{- if .Values.config.database.url }}
  DATABASE_URL: {{ .Values.config.database.url | quote }}
  {{- else }}
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  {{- end }}
  LITELLM_API_KEY: {{ .Values.secrets.litellmAPIKey | quote }}
  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
  {{- /* S3/MinIO static credentials — only for non-IRSA setups. Leave empty
         when using IRSA (the default AWS credential chain is used instead). */}}
  {{- if .Values.secrets.storageAccessKeyID }}
  STORAGE_ACCESS_KEY_ID: {{ .Values.secrets.storageAccessKeyID | quote }}
  STORAGE_SECRET_ACCESS_KEY: {{ .Values.secrets.storageSecretAccessKey | quote }}
  {{- end }}
{{- end }}
